<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="/business-card.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #4f46e5;
      --accent-tonal: #eef2ff;
      --accent-on-tonal: #4338ca;
      --outline: #cbd5e1;
      --outline-focus: #6366f1;
      --text: #0f172a;
      --text-secondary: #64748b;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Roboto', Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 500px;
      animation: app-fade 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes app-fade { 
      from { opacity: 0; transform: translateY(8px) scale(0.99); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
      text-align: center;
    }

    .header .logo-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .header .logo-dot {
      width: 14px; height: 14px; background-color: var(--accent); border-radius: 4px;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
      letter-spacing: -0.5px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 32px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(0, 0, 0, 0.02);
      box-sizing: border-box;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 8px;
    }

    .select-card-btn {
      background: var(--surface);
      border: 1px solid var(--outline);
      border-radius: var(--radius-md);
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }
    .select-card-btn:hover { 
      border-color: var(--outline-focus); 
      background: var(--accent-tonal);
      color: var(--accent-on-tonal);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .select-card-btn:active {
      transform: translateY(0);
    }

    .progress-container-wrapper {
      margin-top: 24px;
      display: none;
    }

    .progress-indicator {
      height: 6px; width: 100%; background-color: #f1f5f9; border-radius: 100px; overflow: hidden;
    }
    .progress-bar-value {
      width: 100%; height: 100%; background: linear-gradient(90deg, var(--accent), #818cf8); 
      animation: loading-bar 1.5s infinite linear; transform-origin: 0% 50%;
    }
    @keyframes loading-bar {
      0% { transform: translateX(0) scaleX(0); }
      40% { transform: translateX(0) scaleX(0.4); }
      100% { transform: translateX(100%) scaleX(0.5); }
    }

    .btn {
      font-family: inherit; font-weight: 600; font-size: 14px; letter-spacing: .2px;
      padding: 0 24px; border-radius: var(--radius-sm); border: none; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; height: 48px; 
      box-sizing: border-box; width: 100%; transition: var(--transition);
    }
    .btn-filled { background-color: var(--primary); color: white; box-shadow: var(--shadow-sm); }
    .btn-filled:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn-filled:active { transform: translateY(0); }
    .btn-filled:disabled { background-color: #f1f5f9 !important; color: #94a3b8 !important; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
      
    .btn-tonal { background-color: var(--accent-tonal); color: var(--accent-on-tonal); margin-top: 14px; }
    .btn-tonal:hover { background-color: #e0e7ff; transform: translateY(-1px); }
    .btn-tonal:active { transform: translateY(0); }

    .field-wrapper {
      position: relative; margin-bottom: 20px; width: 100%; box-sizing: border-box;
    }
    .field-wrapper input, .field-wrapper textarea {
      width: 100%; border: 1px solid var(--outline); border-radius: var(--radius-sm); padding: 16px 16px;
      box-sizing: border-box; font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text);
      transition: var(--transition);
    }
    .field-wrapper input:focus, .field-wrapper textarea:focus {
      border-color: var(--outline-focus); outline: none; background: var(--surface);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .field-wrapper label {
      position: absolute; left: 14px; top: -9px; background: var(--surface); padding: 0 6px;
      font-size: 12px; font-weight: 600; color: var(--text-secondary); border-radius: 4px;
    }
    .field-wrapper input:focus + label, .field-wrapper textarea:focus + label { color: var(--outline-focus); }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 4px 16px; }
    .full-width { grid-column: 1 / -1; }
    textarea { min-height: 90px; resize: vertical; }

    .result-preview-container {
      text-align: center; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #f1f5f9;
      display: flex; flex-direction: column; align-items: center;
    }
    .preview-img {
      max-width: 100%; max-height: 180px; object-fit: contain; border-radius: var(--radius-md);
      box-shadow: var(--shadow-md); border: 1px solid rgba(0,0,0,0.05);
      animation: zoom-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes zoom-in { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .toast {
      position: fixed; bottom: 24px; left: 24px; right: 24px; max-width: 360px; margin: 0 auto;
      background: var(--primary); color: white; padding: 14px 20px; border-radius: var(--radius-sm);
      font-size: 14px; font-weight: 500; display: none; z-index: 1000; box-shadow: var(--shadow-lg);
      word-break: break-all; text-align: center; animation: toast-up 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes toast-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* --- 検索機能用の追加CSS --- */
    .search-toggle-wrapper {
      margin-top: 16px;
      text-align: center;
    }
    
    .search-panel {
      display: none;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px dashed var(--outline);
      animation: app-fade 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    /* セレクトボックス（プルダウン）のモダン化 */
    .field-wrapper select {
      width: 100%; border: 1px solid var(--outline); border-radius: var(--radius-sm); padding: 16px 16px;
      box-sizing: border-box; font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text);
      transition: var(--transition); appearance: none; -webkit-appearance: none; cursor: pointer;
    }
    .field-wrapper select:focus {
      border-color: var(--outline-focus); outline: none; background: var(--surface);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    /* プルダウンの矢印アイコン */
    .field-wrapper::after {
      content: "▼"; font-size: 10px; color: var(--text-secondary); position: absolute; right: 16px; top: 22px; pointer-events: none;
    }
    /* テキスト入力欄のラッパーには矢印を出さないように制限 */
    .field-wrapper:not(.select-wrapper)::after { content: none; }

    /* 検索結果リストのスタイリング */
    .results-list {
      margin-top: 20px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .result-item {
      padding: 14px; background: var(--bg); border: 1px solid var(--outline); border-radius: var(--radius-sm);
      cursor: pointer; transition: var(--transition); text-align: left;
    }
    .result-item:hover {
      border-color: var(--outline-focus); background: var(--surface); transform: translateX(2px); box-shadow: var(--shadow-sm);
    }
    .result-item .item-name { font-weight: 600; font-size: 15px; color: var(--text); }
    .result-item .item-sub { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

    .item-name-row { display: flex; align-items: center; }
    .item-mobile { margin-left: auto; font-size: 14px; color: #64748b; }
    
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo-container">
      <div class="logo-dot"></div>
    </div>
    <h1>名刺管理アプリ</h1>
  </div>

<div class="card" id="uploadCard">
    <div class="action-grid">
      <div class="select-card-btn" id="camBtn" onclick="document.getElementById('cameraInput').click()"><span>📸</span>カメラで撮影</div>
      <div class="select-card-btn" id="fileBtn" onclick="document.getElementById('fileInput').click()"><span>📁</span>ファイル選択</div>
    </div>
    <div style="text-align:center; font-size:13px; color:var(--text-secondary); margin-top:16px; font-weight: 500;" id="statusLabel">
      名刺を選択すると、即座にAI解析を開始します
    </div>

    <div class="search-toggle-wrapper">
      <button class="btn btn-tonal" id="openSearchBtn" style="height: 36px; width: auto; padding: 0 16px;" onclick="toggleSearchPanel()">🔍 登録済みの名刺を検索</button>
    </div>

    <div id="searchPanel" class="search-panel">
      <div class="form-grid">
        <div class="field-wrapper select-wrapper">
          <select id="searchCompany">
            <option value="">すべての会社</option>
            </select>
          <label>会社名</label>
        </div>
        <div class="field-wrapper">
          <input id="searchKeyword" placeholder="氏名、メール、メモなど...">
          <label>検索キーワード</label>
        </div>
      </div>
      
      <button class="btn btn-filled" id="executeSearchBtn" style="height: 40px; margin-top: 4px;" onclick="executeSearch()">検索する</button>
      
      <div id="searchResults" class="results-list"></div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="processAndRun(this)">
    <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="processAndRun(this)">

    <div id="progressIndicator" class="progress-container-wrapper">
      <div class="progress-indicator">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>

  <div id="resultCard" style="display:none" class="card">
    <div class="result-preview-container">
      <img id="preview" class="preview-img">
      <div style="font-size:12px; color:var(--text-secondary); margin-top:12px; font-weight:600;">AI自動トリミング済</div>
      <button class="btn btn-tonal" style="width:auto; height:36px; padding:0 16px; margin-top:12px; font-size:12px; border-radius: var(--radius-sm);" onclick="rotateImage(90)">🔄 画像を90度回転</button>
    </div>

    <div class="form-grid">
      <div class="field-wrapper"><input id="company"><label>会社名</label></div>
      <div class="field-wrapper"><input id="department"><label>部署・役職</label></div>
      <div class="field-wrapper"><input id="name"><label>氏名</label></div>
      <div class="field-wrapper"><input id="email"><label>メールアドレス</label></div>
      <div class="field-wrapper"><input id="tel"><label>電話番号</label></div>
      <div class="field-wrapper"><input id="mobile"><label>携帯番号</label></div>
      <div class="field-wrapper"><input id="fax"><label>FAX番号</label></div>
      <div class="field-wrapper"><input id="url"><label>会社URL</label></div>
      <div class="field-wrapper full-width"><input id="address"><label>住所</label></div>
      <div class="field-wrapper full-width"><input id="tag" placeholder="例: 取引先, 重要"><label>タグ</label></div>
      <div class="field-wrapper full-width"><textarea id="memo"></textarea><label>メモ</label></div>
    </div>
      
    <button class="btn btn-filled" id="saveBtn" onclick="save()">名刺情報を保存</button>
    <button class="btn btn-tonal" id="resetBtn" onclick="resetUI()">別の名刺をスキャン</button>
  </div>
  <canvas id="hiddenCanvas" style="display:none;"></canvas>
</div>

<div id="toast" class="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbykD3pVpoEfNFYE5fY6l8yIYUeOTBzmlRigNYh10_Mnkn8QaiAH5zxk7umuCi7avJD8Iw/exec";

let currentData = {};
let finalBase64 = "";
let selectedFileName = "";
let isProcessing = false;
let isCompanyListLoaded = false; 

// GASから重複のない会社名一覧を取得してプルダウンにセットする
async function fetchCompanyList() {
  const selectEl = document.getElementById("searchCompany");
  selectEl.disabled = true;
  selectEl.options[0].text = "⏳ 会社名を取得中...";

  try {
    // VercelからGASへ会社名取得リクエスト (CORS回避のため text/plain で送信)
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: "getCompanies" })
    });
    
    const result = await response.json();
    
    if (result.success && Array.isArray(result.companies)) {
      // 一旦「すべての会社」以外をクリア
      selectEl.innerHTML = '<option value="">すべての会社</option>';
      
      // 取得した会社名をプルダウンに追加
      result.companies.forEach(company => {
        if (company) { // 空白行は除外
          const opt = document.createElement("option");
          opt.value = company;
          opt.textContent = company;
          selectEl.appendChild(opt);
        }
      });
      
      isCompanyListLoaded = true;
    } else {
      throw new Error(result.error || "会社名の取得に失敗しました");
    }
  } catch (err) {
    showToast("会社名取得エラー: " + err.message);
    selectEl.options[0].text = "⚠️ 取得失敗 (再起動してください)";
  } finally {
    selectEl.disabled = false;
    if (isCompanyListLoaded) {
      selectEl.options[0].text = "すべての会社";
    }
  }
}

// 検索パネルの表示・非表示を切り替える
async function toggleSearchPanel() {
  const panel = document.getElementById("searchPanel");
  const btn = document.getElementById("openSearchBtn");
  
  if (panel.style.display === "block") {
    panel.style.display = "none";
    btn.innerText = "🔍 登録済みの名刺を検索";
  } else {
    panel.style.display = "block";
    btn.innerText = "🔼 検索パネルを閉じる";
    
    // まだ会社名リストを読み込んでいなければ、GASから取得する
    if (!isCompanyListLoaded) {
      await fetchCompanyList();
    }
  }
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = error => reject(error);
    reader.readAsDataURL(file);
  });
}

async function compressBase64(base64, maxWidth = 1400, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      let w = img.width;
      let h = img.height;
      if (w > maxWidth) {
        h = Math.round(h * (maxWidth / w));
        w = maxWidth;
      }
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
    };
    img.src = "data:image/jpeg;base64," + base64;
  });
}

function showToast(msg) { 
  const t = document.getElementById("toast"); 
  t.style.display = "block"; 
  t.innerText = msg; 
  setTimeout(() => { t.style.display = "none"; }, 4000); 
}

async function processAndRun(inputElement) {
  if (isProcessing) return;

  const selectedFile = inputElement.files[0];
  if (!selectedFile) return;

  isProcessing = true;
  selectedFileName = selectedFile.name;
  document.getElementById("statusLabel").innerText = "⏳ AIが解析中...";
  document.getElementById("progressIndicator").style.display = "block";
  
  document.getElementById("cameraInput").disabled = true;
  document.getElementById("fileInput").disabled = true;
  document.querySelectorAll(".select-card-btn").forEach(el => {
    el.style.pointerEvents = "none";
    el.style.opacity = "0.5";
  });

  try {
    const rawBase64 = await fileToBase64(selectedFile);
    const compressedRaw = await compressBase64(rawBase64, 1400, 0.85);

    // VercelからGASウェブアプリへPOST通信（Content-Typeを指定してCORSプリフライトエラーを完全回避）
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({ action: "gemini", base64: compressedRaw })
    });
    
    const result = await response.json();

    if (result.success) {
      isProcessing = false;
      handleOcrResult(result.data, compressedRaw);
    } else {
      throw new Error(result.error || "解析に失敗しました");
    }

  } catch (e) {
    isProcessing = false;
    endLoading();
    showToast("解析エラー: " + e.message);
  }
}

async function handleOcrResult(resultObj, compressedRaw) {
  try {
    const res = resultObj;
    
    if (res.座標 && res.座標.ymin !== undefined) {
      finalBase64 = await cropImageByBounds(compressedRaw, res.座標, res.回転);
    } else {
      finalBase64 = compressedRaw; 
    }

    document.getElementById("progressIndicator").style.display = "none";
    document.getElementById("uploadCard").style.display = "none"; 
    document.getElementById("resultCard").style.display = "block";
    document.getElementById("resultCard").scrollIntoView({ behavior: "smooth" });

    document.getElementById("preview").src = "data:image/jpeg;base64," + finalBase64;

    currentData = res;
    currentData.base64 = finalBase64;
    currentData.fileName = selectedFileName;

    setValue("company", res.会社名);
    setValue("department", res.部署);
    setValue("name", res.氏名);
    setValue("email", res.メールアドレス);
    setValue("tel", res.電話番号);
    setValue("mobile", res.携帯番号);
    setValue("fax", res.FAX);
    setValue("address", res.住所);
    setValue("url", res.会社URL);
    
    showToast("解析が完了しました");
  } catch (e) {
    endLoading();
    showToast("データ処理エラーが発生しました。");
    console.error(e);
  }
}

async function cropImageByBounds(base64, bounds, rotateAngle = 0) {
  return new Promise((resolve) => {
    const img = new Image(); 
    img.src = "data:image/jpeg;base64," + base64;
    img.onload = () => {
      try {
        const canvas = document.getElementById("hiddenCanvas"); 
        const ctx = canvas.getContext("2d");

        const rawW = bounds.xmax - bounds.xmin;
        const rawH = bounds.ymax - bounds.ymin;
        const paddingPercent = 0.03; 
        const padW = rawW * paddingPercent;
        const padH = rawH * paddingPercent;

        const safeXmin = Math.max(0, bounds.xmin - padW);
        const safeYmin = Math.max(0, bounds.ymin - padH);
        const safeXmax = Math.min(1000, bounds.xmax + padW);
        const safeYmax = Math.min(1000, bounds.ymax + padH);

        const x = (safeXmin / 1000) * img.width; 
        const y = (safeYmin / 1000) * img.height;
        const w = ((safeXmax - safeXmin) / 1000) * img.width; 
        const h = ((safeYmax - safeYmin) / 1000) * img.height;
        
        if (w <= 0 || h <= 0 || isNaN(w) || isNaN(h)) {
          resolve(base64);
          return;
        }

        const angle = parseInt(rotateAngle, 10) || 0;
        let drawAngle = 0;
        if (angle === 90)  drawAngle = 270; 
        if (angle === 180) drawAngle = 180; 
        if (angle === 270) drawAngle = 90;  

        if (angle === 90 || angle === 270) {
          canvas.width = h; 
          canvas.height = w;
        } else {
          canvas.width = w; 
          canvas.height = h;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((drawAngle * Math.PI) / 180); 
        ctx.drawImage(img, x, y, w, h, -w / 2, -h / 2, w, h);

        resolve(canvas.toDataURL("image/jpeg", 0.85).split(",")[1]);
      } catch(e) {
        resolve(base64); 
      }
    };
    img.onerror = () => { resolve(base64); };
  });
}

function rotateImage(degrees = 90) {
  if (!finalBase64) return;
  
  const img = new Image();
  img.src = "data:image/jpeg;base64," + finalBase64;
  img.onload = () => {
    const canvas = document.getElementById("hiddenCanvas");
    const ctx = canvas.getContext("2d");
    
    canvas.width = img.height;
    canvas.height = img.width;
    
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((degrees * Math.PI) / 180);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    
    finalBase64 = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    document.getElementById("preview").src = "data:image/jpeg;base64," + finalBase64;
    currentData.base64 = finalBase64;
    
    showToast("画像を回転しました");
  };
}

async function save() {
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;

  currentData.会社名 = getValue("company");
  currentData.部署 = getValue("department");
  currentData.氏名 = getValue("name");
  currentData.メールアドレス = getValue("email");
  currentData.電話番号 = getValue("tel");
  currentData.携帯番号 = getValue("mobile");
  currentData.FAX = getValue("fax");
  currentData.住所 = getValue("address");
  currentData.会社URL = getValue("url");
  currentData.タグ = getValue("tag");
  currentData.メモ = getValue("memo");

  // 既存データの更新で、画像データがまだセットされていない場合の処理
  if (currentData.rowNumber && !currentData.base64) {
    const previewImg = document.querySelector(".result-preview-container img");
    if (previewImg && previewImg.src.startsWith("data:image")) {
      // 表示されている "data:image/jpeg;base64,XXXX..." の「XXXX...」の純粋なデータ部分だけを抽出
      currentData.base64 = previewImg.src.split(",")[1];
    }
  }

  try {
    // スプレッドシート保存リクエスト（Content-Typeを指定してCORSプリフライトエラーを完全回避）
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify({ action: "save", currentData: currentData })
    });
    
    const result = await response.json();

    if (result.success) {
      saveBtn.disabled = false;
      showToast("スプレッドシートとドライブに保存しました");
      setTimeout(() => resetUI(), 1200); 
    } else {
      throw new Error(result.error || "保存に失敗しました");
    }
  } catch (err) {
    saveBtn.disabled = false;
    showToast("保存エラー: " + err.message);
  }
}

function resetUI() {
  endLoading();
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("uploadCard").style.display = "block";
  // 非表示にしていた画像エリアをフロント表示用に復元
  document.querySelector(".result-preview-container").style.display = "flex"; 
  
  finalBase64 = "";
}

function endLoading() {
  document.getElementById("progressIndicator").style.display = "none";
  document.getElementById("statusLabel").innerText = "名刺を選択すると、即座にAI解析を開始します";
  
  const cam = document.getElementById("cameraInput");
  const fileInputEl = document.getElementById("fileInput");
  if (cam) { cam.disabled = false; cam.value = ""; }
  if (fileInputEl) { fileInputEl.disabled = false; fileInputEl.value = ""; }

  document.querySelectorAll(".select-card-btn").forEach(el => {
    el.style.pointerEvents = "auto";
    el.style.opacity = "1";
  });
}

function getValue(id) { return document.getElementById(id).value || ""; }
function setValue(id, val) { const el = document.getElementById(id); if(el) el.value = val || ""; }

// --- 検索機能用の追加JavaScript
let searchCache = []; // 検索結果を一時的に保存する配列
// フロント側からGASへ検索をリクエストする
async function executeSearch() {
  const company = document.getElementById("searchCompany").value;
  const keyword = document.getElementById("searchKeyword").value;
  const searchBtn = document.getElementById("executeSearchBtn");
  const resultsDiv = document.getElementById("searchResults");
  
  searchBtn.disabled = true;
  searchBtn.innerText = "⏳ 検索中...";
  resultsDiv.innerHTML = "";

  try {
    const response = await fetch(GAS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "searchCards",
        params: { company: company, keyword: keyword }
      })
    });
    
    const result = await response.json();
    
    if (result.success) {
      searchCache = result.results; // 取得データをキャッシュ
      
      if (searchCache.length === 0) {
        resultsDiv.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:14px; padding:16px; font-weight:500;">該当する名刺が見つかりませんでした</div>';
        return;
      }
      
      // 検索結果を1件ずつリストアイテムとして生成
      searchCache.forEach((item, index) => {
        const itemEl = document.createElement("div");
        itemEl.className = "result-item";
        console.log("【デバッグ】GASから届いたデータ:", item); // 💡ココを追加！
        itemEl.onclick = () => selectSearchResult(index); // クリックでフォームに展開
        
        itemEl.innerHTML = `
          <div class="item-name-row">
            <div class="item-name">${escapeHtml(item.name || "氏名なし")}</div>
            ${item.mobile
              ? `<div class="item-mobile">${escapeHtml(item.mobile)}</div>`
              : ''}
          </div>
          <div class="item-sub">
            ${escapeHtml(item.company || "会社名なし")}
            ${item.email ? ' ｜ ' + escapeHtml(item.email) : ''}
          </div>
        `;
        resultsDiv.appendChild(itemEl);
      });
    } else {
      throw new Error(result.error || "検索に失敗しました");
    }
  } catch (err) {
    showToast("検索エラー: " + err.message);
  } finally {
    searchBtn.disabled = false;
    searchBtn.innerText = "検索する";
  }
}

// 画像URLの変換方式変更 ＆ ヘッダー名マッピングの厳密化
async function selectSearchResult(index) {
  const item = searchCache[index];
  if (!item) return;
  
  // 1. 画面を切り替える
  document.getElementById("uploadCard").style.display = "none";
  document.getElementById("resultCard").style.display = "block";
  window.scrollTo({ top: 0, behavior: 'smooth' });
  
  // 2. 【画像表示処理】💡ここを丸ごと書き換え。GASからオンデマンドでBase64を通信取得
  const previewContainer = document.querySelector(".result-preview-container");
  const imgElement = previewContainer ? previewContainer.querySelector("img") : null;

  if (previewContainer && imgElement) {
    // 安全に「ファイルURL」列の値を取得
    const fileUrlIdx = item.header ? item.header.indexOf("ファイルURL") : -1;
    const targetUrl = fileUrlIdx !== -1 ? item.rowData[fileUrlIdx] : (item.fileUrl || item.imageUrl);

    if (targetUrl) {
      previewContainer.style.display = "flex";
      imgElement.src = ""; // 前の画像をクリア
      imgElement.alt = "⌛ 画像を読み込み中...";

      try {
        // GASに対して、このURLの画像バイナリを要求する
        const response = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "getCardImage",
            fileUrl: targetUrl
          })
        });
        
        const res = await response.json();
        
        if (res.success && res.base64) {
          // 💡URLではなく「Base64生データ」をダイレクトにimgタグにブチ込む
          imgElement.src = "data:image/jpeg;base64," + res.base64;
          imgElement.alt = "名刺画像";
        } else {
          imgElement.alt = "❌ 画像の取得に失敗しました";
          console.error("GAS側エラー:", res.error);
        }
      } catch (err) {
        imgElement.alt = "❌ 通信エラーが発生しました";
        console.error("通信エラー:", err);
      }
    } else {
      previewContainer.style.display = "none";
    }
  }  
  // 3. 【フォームへのデータ流し込み】
  const header = item.header;
  const rowData = item.rowData;
  
  setValue("company", item.company);
  setValue("name", item.name);
  setValue("email", item.email);
  
  // 💡ここを修正：スプレッドシートの「1行目の項目名」と完全に一致させてください
  const fields = {
    "会社名": "company",
    "部署": "department",
    "氏名": "name",
    "メールアドレス": "email",
    "電話番号": "tel",
    "携帯番号": "mobile",
    "FAX": "fax",
    "住所": "address",
    "会社URL": "url",
    "タグ": "tag",
    "メモ": "memo"
  };

  for (const [headerName, inputId] of Object.entries(fields)) {
    const colIdx = header.indexOf(headerName);
    if (colIdx !== -1) {
      setValue(inputId, rowData[colIdx]);
    } else {
      setValue(inputId, "");
    }
  }
  
  currentData = {
    rowNumber: item.rowNumber
  };
  
  showToast("名刺データを読み込みました");
}
  
// セキュリティ用：HTMLエスケープ処理
function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
